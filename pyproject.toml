[build-system]
requires = ["setuptools>=64", "torch>=2.0", "ninja", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-structured"
version = "0.4.0"
description = "Butterfly, low-displacement-rank, and Monarch structured-matrix primitives in PyTorch"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    { name = "Tri Dao", email = "trid@stanford.edu" },
]
keywords = [
    "pytorch",
    "butterfly",
    "fft",
    "structured-matrices",
    "kaleidoscope",
    "low-displacement-rank",
    "monarch",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "einops",
    "opt_einsum",
]

[project.optional-dependencies]
cupy = ["cupy-cuda12x"]
dev = [
    "pytest",
    "flake8",
]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/hazyresearch/learning-circuits"

[tool.setuptools.packages.find]
include = ["torch_structured*"]
